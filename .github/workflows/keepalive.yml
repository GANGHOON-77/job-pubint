name: Keepalive (60일 자동 비활성화 방지)

# GitHub은 저장소에 60일간 활동(커밋)이 없으면 예약 워크플로를 자동으로 끕니다.
# 매월 1일·15일에 빈 커밋을 남겨 수집 워크플로가 계속 실행되도록 유지합니다.
on:
  schedule:
    - cron: '17 3 1,15 * *'   # 매월 1일·15일 12:17 (KST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Empty commit to keep scheduled workflows active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (prevent 60-day scheduled workflow disable)"
          git push
